# 推一个 v* 标签就自动出 AppImage 和 pip 包，附到 Release 上。
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Build AppImage
        run: |
          # appimagetool 需要 FUSE 才能自解压，CI 里用 --appimage-extract-and-run 绕过。
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2 desktop-file-utils
          ./packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: small-galaxy
          path: |
            dist/*
            build/*.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            build/*.AppImage
          body: |
            下载 `SmallGalaxy-x86_64.AppImage`，`chmod +x` 后双击即用（Linux）。
            其他平台：`pip install small-galaxy`。
