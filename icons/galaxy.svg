<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181030"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="armBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8FA8FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B98CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="armPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6FA8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFA0D2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD37A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FFE9B8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE9B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>

  <ellipse cx="64" cy="64" rx="46" ry="15" fill="url(#armBlue)" transform="rotate(-30 64 64)"/>
  <ellipse cx="64" cy="64" rx="37" ry="11" fill="url(#armPink)" transform="rotate(58 64 64)"/>

  <circle cx="64" cy="64" r="15" fill="url(#core)"/>
  <circle cx="64" cy="64" r="4.2" fill="#FFFDF5"/>

  <circle cx="30" cy="32" r="1.8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="96" cy="38" r="1.3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="38" cy="98" r="1.6" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="90" cy="92" r="2.1" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="103" cy="62" r="1.1" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="22" cy="70" r="1.2" fill="#FFFFFF" opacity="0.6"/>
</svg>
